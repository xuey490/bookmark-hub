# Bookmark Hub · Nginx 静态直出配置（推荐）
#
# 与 nginx.conf 的区别：
#   nginx.conf      —— 所有请求（含前端静态文件）都反代给 Uvicorn，部署最简单；
#   nginx-static.conf —— 前端由 Nginx 直接读磁盘，只有 /api、/media 等转给后端，
#                        静态资源不经过 Python，性能更好、可加缓存与 gzip。
#
# 使用方式：把 dist 放到任意目录（下例 /var/www/bookmark-hub/web），
# 改好 server_name、证书路径、root、alias 后：
#   sudo cp deploy/nginx-static.conf /etc/nginx/conf.d/bookmark-hub.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 此时后端可以完全不知道 dist 在哪，甚至不构建也行；
# 若仍想保留后端托管（例如本机直连 8000 调试），保持 BK_WEB_DIST 指向 dist 即可。

server {
    listen 80;
    server_name bookmark.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bookmark.example.com;

    ssl_certificate     /etc/letsencrypt/live/bookmark.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookmark.example.com/privkey.pem;

    # 前端构建产物目录：可以是任意路径，nginx 用户需有读权限
    root /var/www/bookmark-hub/web;
    index index.html;

    # 导入书签上传文件用；截图上传（v1.2）也走这里
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # 带内容 hash 的资源可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不能缓存，否则发版后用户仍拿到旧的 assets 引用
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 前端使用 hash 路由（/#/bookmarks），浏览器只会请求 /，
    # 这里保留 fallback 只是为了让将来切换到 history 路由时不用再改配置。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 截图等媒体文件：直接读磁盘，不经过 Python。
    # 注意只 alias 到 screenshots 子目录，绝不能 alias 到 data/ 根目录，
    # 否则 api_token.txt 和 bookmarks.db 会变成可下载文件。
    # 若前后端不在同一台机器，改为 proxy_pass http://127.0.0.1:8000;
    location /media/screenshots/ {
        alias /opt/bookmark-hub/backend/data/screenshots/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 健康检查与接口文档
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
